name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: dbt build (models + tests)
        run: make build

      - name: Rebuild exports
        run: make exports

      - name: Check committed exports are up to date
        run: git diff --exit-code --stat -- dashboard/data.js
