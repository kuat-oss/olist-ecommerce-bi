name: olist_bi
version: "1.0.0"
config-version: 2
profile: olist_bi

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false

vars:
  # Olist data is thin before 2017 and after Aug 2018, so KPIs use this window
  analysis_start: "2017-01-01"
  analysis_end: "2018-08-31"

models:
  olist_bi:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
